# Gate1 OASIS 3 类合并 config（附录任务，reportable）
# 继承 gate1_oasis.yaml，仅改：label_remap(4→3) / num_classes / split+log 独立目录。
# Moderate Dementia 仅 2 subject 无法独立评估 → 并入 Mild Dementia，得 Non / Very mild / Mild(+Moderate) 3 类。
# 其余（patient split / subject_id_regex / lr / epochs / class_weight / Quantus / wavelet / gradshap 官方值）与 4 类版一致。

# ---- 数据 ----
dataset: oasis
data_root: null

split_mode: patient  # 按 subject ID 分组，防切片泄漏（命门）
subject_id_regex: "^(OAS\\d+_\\d+)"
train_ratio: 0.70
val_ratio: 0.15
test_ratio: 0.15
random_seed: 42

split_csv_dir: log/splits_oasis_3class  # 独立目录，不撞 4 类版

# ---- 类重映射（3 类：Moderate 并入 Mild，其余恒等）----
# 未列出的类保持恒等（Non Demented / Very mild Dementia 不变）；
# 下游 sorted(unique)：Mild Dementia=0 / Non Demented=1 / Very mild Dementia=2（data_split 会打印 label→index）
label_remap:
  "Moderate Dementia": "Mild Dementia"

# ---- 图像预处理 ----
image_size: 224
normalize_mean: [0.485, 0.456, 0.406]
normalize_std: [0.229, 0.224, 0.225]

# ---- 分类器 ----
backbone: resnet50  # resnet50 | vit_b_16
num_classes: 3      # 3 类（与 label_remap 后唯一类数一致，data_split assert）
pretrained: true

optimizer: adam
lr: 1.0e-4
batch_size: 64
epochs: 50
scheduler: cosine

use_class_weight: true

num_workers: 8
pin_memory: true

aug_hflip: true
aug_rotation_degrees: 15
aug_vflip: false

# Quantus 正式参数（GPU 不提速）
pixelflip_features_in_step: 512
road_percentages: null

# ---- 多 XAI 超参（faithfulness.py，researcher 核 captum 官方签名）----
ig_n_steps: 50
ig_baseline: zero
gradshap_n_samples: 50
gradshap_stdevs: 0.0001
gradshap_n_baseline: 5
wavelet_wave: db1
wavelet_mode: symmetric

# ---- 输出（独立目录，不撞 4 类版）----
log_dir: log/hpc_oasis_3class
checkpoint_dir: log/hpc_oasis_3class/checkpoints
results_csv: log/hpc_oasis_3class/classifier_results.csv
state_json: log/hpc_oasis_3class/classifier_state.json
