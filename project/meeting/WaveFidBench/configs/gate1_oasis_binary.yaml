# Gate1 OASIS 二分类 config（主任务，reportable）
# 继承 gate1_oasis.yaml，仅改：label_remap(4→2) / num_classes / split+log 独立目录。
# 因 OASIS Moderate 仅 2 subject，患者级 split 下 4 类评估不了 → 合并成 Non vs Demented。
# 其余（patient split / subject_id_regex / lr / epochs / class_weight / Quantus / wavelet / gradshap 官方值）与 4 类版一致。

# ---- 数据 ----
dataset: oasis
data_root: null

split_mode: patient  # 按 subject ID 分组，防切片泄漏（命门）
subject_id_regex: "^(OAS\\d+_\\d+)"
train_ratio: 0.70
val_ratio: 0.15
test_ratio: 0.15
random_seed: 42

split_csv_dir: log/splits_oasis_binary  # 独立目录，不撞 4 类版

# ---- 类重映射（二分类：Non vs Demented）----
# 原文件夹名 → 目标类；下游 sorted(unique)：Demented=0 / Non=1（可复现，data_split 会打印 label→index）
label_remap:
  "Non Demented": "Non"
  "Very mild Dementia": "Demented"
  "Mild Dementia": "Demented"
  "Moderate Dementia": "Demented"

# ---- 图像预处理 ----
image_size: 224
normalize_mean: [0.485, 0.456, 0.406]
normalize_std: [0.229, 0.224, 0.225]

# ---- 分类器 ----
backbone: resnet50  # resnet50 | vit_b_16
num_classes: 2      # 二分类（与 label_remap 后唯一类数一致，data_split assert）
pretrained: true

optimizer: adam
lr: 1.0e-4
batch_size: 64
epochs: 50
scheduler: cosine

use_class_weight: true

num_workers: 8
pin_memory: true

aug_hflip: true
aug_rotation_degrees: 15
aug_vflip: false

# Quantus 正式参数（GPU 不提速）
pixelflip_features_in_step: 512
road_percentages: null

# ---- 多 XAI 超参（faithfulness.py，researcher 核 captum 官方签名）----
ig_n_steps: 50
ig_baseline: zero
gradshap_n_samples: 50
gradshap_stdevs: 0.0001
gradshap_n_baseline: 5
wavelet_wave: db1
wavelet_mode: symmetric

# ---- 输出（独立目录，不撞 4 类版）----
log_dir: log/hpc_oasis_binary
checkpoint_dir: log/hpc_oasis_binary/checkpoints
results_csv: log/hpc_oasis_binary/classifier_results.csv
state_json: log/hpc_oasis_binary/classifier_state.json
